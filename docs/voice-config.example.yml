# ───────────────────────────────────────────────────────────────────────
# Voice input configuration for OpenClacky (EXAMPLE)
#
# Copy this file to:  ~/.clacky/voice-config.yml
# Then uncomment and customize the settings below.
#
# All settings have sensible defaults — voice input works without this file.
# ───────────────────────────────────────────────────────────────────────

# ── ASR engine ──────────────────────────────────────────────────────
# asr:
#   provider: dashscope        # google | dashscope
#   api_key: ""                # DashScope API key (sk-xxx)

# ── Keyboard shortcuts ──────────────────────────────────────────────
# Modifier values (maps to KeyboardEvent properties):
#   Control → e.ctrlKey   Shift → e.shiftKey
#   Alt     → e.altKey     Meta  → e.metaKey (Cmd on Mac, Win on Windows)
#
# Key values reference:
#   https://developer.mozilla.org/en-US/docs/Web/API/UI_Events/Keyboard_event_key_values
#
# shortcuts:
#   toggle:
#     modifiers: [Control, Shift]
#     key: z
#   stop:
#     modifiers: [Control, Shift]
#     key: s
#   start:
#     modifiers: [Control, Shift]
#     key: r
#   voice_mode:
#     modifiers: [Control, Shift]
#     key: m

# ── Voice exit commands ─────────────────────────────────────────────
# Spoken phrases that end voice interaction mode.
#
# exit_words:
#   - stop listening
#   - exit voice
#   - goodbye

# ── Voice behavior ──────────────────────────────────────────────────
# silence_timeout_ms: 1500        # ms of silence before auto-finalizing (Hands-free mode only)
# voice_mode_restart_delay_ms: 300 # delay before auto-restarting in Hands-free mode
# language: en-US                 # BCP-47 recognition language
# default_mode: push-to-talk      # Initial voice mode: push-to-talk | hands-free

# ── Sound effects ───────────────────────────────────────────────────
# Place custom audio files in ~/.clacky/sounds/.
# Supported formats: WAV, MP3, OGG.
# Values: "default" (voice_start.wav / voice_stop.wav in web root), "none" (silent),
# or a filename like "ding.wav" (from ~/.clacky/sounds/).
#
# sound:
#   start: default
#   stop: default
#   volume: 0.4               # 0.0 ~ 1.0
