id: codex
name: ChatGPT
display_name: ChatGPT
display_name_zh: ChatGPT
description: Use ChatGPT through a managed local Codex ACP runtime
description_zh: 通过隔离的本地 Codex ACP 运行时使用 ChatGPT
version: "0.1.0"
origin: self
author: OpenClacky
homepage: https://www.openclacky.com
license: MIT
contributes:
  api: api/handler.rb
  providers:
    - id: codex
      name: ChatGPT
      name_key: provider.name.codex
      runtime_id: codex
      auth_mode: runtime
      credential_fields: []
      dynamic_models: discovery
      capabilities:
        chat: true
        tools: true
        vision: true
      website_url: https://openai.com/codex
  agent_runtimes:
    - id: codex
      adapter: runtime.rb
      class: Clacky::DefaultExtensions::Codex::Runtime
